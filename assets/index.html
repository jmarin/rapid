<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapid - File Upload</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 4rem 1rem;
    }

    main {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 1rem;
    }

    button {
      background: #333;
      color: #fff;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #uploads {
      margin-top: 1rem;
    }

    .file-row {
      margin-bottom: 0.75rem;
    }

    .file-name {
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .progress-wrap progress {
      flex: 1;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      appearance: none;
    }

    .progress-wrap progress::-webkit-progress-bar {
      background: #eee;
      border-radius: 3px;
    }

    .progress-wrap progress::-webkit-progress-value {
      background: #333;
      border-radius: 3px;
    }

    .progress-wrap span {
      font-size: 0.8rem;
      min-width: 3ch;
      text-align: right;
    }

    .file-status {
      font-size: 0.8rem;
      margin-top: 0.25rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error {
      color: #c00;
    }

    .success {
      color: #060;
    }
  </style>
</head>

<body>
  <main>
    <h1>Upload Files</h1>
    <label for="file-input">Choose files</label>
    <input type="file" id="file-input" multiple>
    <button id="upload-btn" disabled>Upload</button>
    <div id="uploads"></div>
  </main>
  <script>
    const fileInput = document.getElementById("file-input");
    const uploadBtn = document.getElementById("upload-btn");
    const uploadsDiv = document.getElementById("uploads");

    fileInput.addEventListener("change", () => {
      uploadBtn.disabled = !fileInput.files.length;
      uploadsDiv.innerHTML = "";
    });

    function uploadFile(file) {
      const row = document.createElement("div");
      row.className = "file-row";

      const name = document.createElement("div");
      name.className = "file-name";
      name.textContent = file.name;

      const progressWrap = document.createElement("div");
      progressWrap.className = "progress-wrap";

      const bar = document.createElement("progress");
      bar.max = 100;
      bar.value = 0;

      const pctText = document.createElement("span");
      pctText.textContent = "0%";

      progressWrap.appendChild(bar);
      progressWrap.appendChild(pctText);

      const statusDiv = document.createElement("div");
      statusDiv.className = "file-status";

      row.appendChild(name);
      row.appendChild(progressWrap);
      row.appendChild(statusDiv);
      uploadsDiv.appendChild(row);

      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/upload");

        xhr.upload.addEventListener("progress", (e) => {
          if (e.lengthComputable) {
            const pct = Math.round((e.loaded / e.total) * 100);
            bar.value = pct;
            pctText.textContent = pct + "%";
          }
        });

        xhr.addEventListener("load", () => {
          if (xhr.status === 201) {
            const data = JSON.parse(xhr.responseText);
            statusDiv.className = "file-status success";
            const sizeMB = (data.size_bytes / (1024 * 1024)).toFixed(2);
            statusDiv.textContent = `Done — ${sizeMB} MB, ${data.mime_type}`;
          } else {
            statusDiv.className = "file-status error";
            statusDiv.textContent = `Error ${xhr.status}: ${xhr.responseText}`;
          }
          resolve();
        });

        xhr.addEventListener("error", () => {
          statusDiv.className = "file-status error";
          statusDiv.textContent = "Network error";
          resolve();
        });

        xhr.send(file);
      });
    }

    uploadBtn.addEventListener("click", async () => {
      const files = Array.from(fileInput.files);
      if (!files.length) return;

      uploadBtn.disabled = true;
      uploadsDiv.innerHTML = "";

      const uploads = files.map((file) => uploadFile(file));
      await Promise.all(uploads);

      uploadBtn.disabled = false;
    });
  </script>
</body>

</html>
