<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapid - File Upload</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 4rem 1rem;
    }

    main {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 1rem;
    }

    button {
      background: #333;
      color: #fff;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #progress-wrap {
      display: none;
      margin-top: 1rem;
      align-items: center;
      gap: 0.5rem;
    }

    #progress-bar {
      flex: 1;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      appearance: none;
    }

    #progress-bar::-webkit-progress-bar {
      background: #eee;
      border-radius: 3px;
    }

    #progress-bar::-webkit-progress-value {
      background: #333;
      border-radius: 3px;
    }

    #status {
      margin-top: 1rem;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error {
      color: #c00;
    }

    .success {
      color: #060;
    }
  </style>
</head>

<body>
  <main>
    <h1>Upload File</h1>
    <label for="file-input">Choose a file</label>
    <input type="file" id="file-input">
    <button id="upload-btn" disabled>Upload</button>
    <div id="progress-wrap">
      <progress id="progress-bar" max="100" value="0"></progress>
      <span id="progress-text">0%</span>
    </div>
    <div id="status"></div>
  </main>
  <script>
    const fileInput = document.getElementById("file-input");
    const uploadBtn = document.getElementById("upload-btn");
    const progressWrap = document.getElementById("progress-wrap");
    const progressBar = document.getElementById("progress-bar");
    const status = document.getElementById("status");

    const progressText = document.getElementById("progress-text");

    fileInput.addEventListener("change", () => {
      uploadBtn.disabled = !fileInput.files.length;
      status.textContent = "";
      status.className = "";
    });

    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      uploadBtn.disabled = true;
      status.textContent = "";
      status.className = "";
      progressWrap.style.display = "flex";
      progressBar.value = 0;
      progressText.textContent = "0%";

      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/upload");

      xhr.upload.addEventListener("progress", (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          progressBar.value = pct;
          progressText.textContent = pct + "%";
        }
      });

      xhr.addEventListener("load", () => {
        uploadBtn.disabled = false;
        if (xhr.status === 201) {
          const data = JSON.parse(xhr.responseText);
          status.className = "success";
          status.textContent =
            `Upload complete\nID: ${data.id}\nSize: ${data.size_bytes} bytes\nMIME: ${data.mime_type}`;
        } else {
          status.className = "error";
          status.textContent = `Error ${xhr.status}: ${xhr.responseText}`;
        }
      });

      xhr.addEventListener("error", () => {
        uploadBtn.disabled = false;
        status.className = "error";
        status.textContent = "Network error";
      });

      xhr.send(file);
    });
  </script>
</body>

</html>
