<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapid - File Upload</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0b0c10;
      --bg-surface: #13151a;
      --bg-card: #1a1d24;
      --bg-input: #22262f;
      --border-subtle: #2a2f3a;
      --border-hover: #3d4453;
      --text-primary: #e8eaed;
      --text-secondary: #8b90a3;
      --text-dim: #5a6173;
      --accent: #f0c040;
      --accent-glow: rgba(240, 192, 64, 0.15);
      --accent-dim: #c49a20;
      --success: #34d399;
      --success-dim: rgba(52, 211, 153, 0.12);
      --error: #f87171;
      --error-dim: rgba(248, 113, 113, 0.12);
      --progress-track: #22262f;
      --font-display: 'Anybody', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-mono);
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 6vh 1rem;
      overflow-x: hidden;
    }

    /* Atmospheric layered background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(240, 192, 64, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(240, 192, 64, 0.03) 0%, transparent 50%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 120px,
          rgba(240, 192, 64, 0.012) 120px,
          rgba(240, 192, 64, 0.012) 121px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 120px,
          rgba(240, 192, 64, 0.012) 120px,
          rgba(240, 192, 64, 0.012) 121px
        );
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(240, 192, 64, 0.04);

      /* Page load animation */
      animation: card-arrive 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes card-arrive {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Header */
    .header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 2rem;
      animation: fade-in 0.5s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(240, 192, 64, 0.2);
      padding: 0.2rem 0.5rem;
      border-radius: 99px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 2rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-bottom: 1.25rem;
      animation: fade-in 0.5s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--accent-dim);
      background: var(--accent-glow);
    }

    .drop-zone-icon {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      display: block;
      opacity: 0.6;
    }

    .drop-zone-text {
      color: var(--text-secondary);
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .drop-zone-text strong {
      color: var(--accent);
      font-weight: 500;
    }

    .file-count {
      margin-top: 0.6rem;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 500;
      display: none;
    }

    input[type="file"] {
      display: none;
    }

    /* Upload button */
    button {
      font-family: var(--font-display);
      font-weight: 600;
      width: 100%;
      background: var(--accent);
      color: var(--bg-deep);
      border: none;
      padding: 0.75rem 1.4rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
      animation: fade-in 0.5s 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    button:hover:not(:disabled) {
      background: #f5cc5a;
      box-shadow: 0 0 20px rgba(240, 192, 64, 0.25);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Uploads container */
    #uploads {
      margin-top: 1.5rem;
    }

    /* Per-file row */
    .file-row {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      margin-bottom: 0.6rem;
      animation: row-arrive 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes row-arrive {
      from {
        opacity: 0;
        transform: translateX(-12px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .file-name {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.6rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-label {
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-bottom: 0.3rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .progress-wrap progress {
      flex: 1;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      appearance: none;
      overflow: hidden;
    }

    .progress-wrap progress::-webkit-progress-bar {
      background: var(--progress-track);
      border-radius: 2px;
    }

    .progress-wrap progress::-webkit-progress-value {
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* Firefox */
    .progress-wrap progress::-moz-progress-bar {
      background: var(--accent);
      border-radius: 2px;
    }

    .progress-wrap span {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      min-width: 5ch;
      text-align: right;
      color: var(--text-secondary);
    }

    .file-status {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      margin-top: 0.4rem;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 0.4rem 0.6rem;
      border-radius: var(--radius-sm);
      animation: status-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes status-pop {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .error {
      color: var(--error);
      background: var(--error-dim);
    }

    .success {
      color: var(--success);
      background: var(--success-dim);
    }

    /* Download link */
    .download-link {
      display: none;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.6rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      text-decoration: none;
      padding: 0.3rem 0.65rem;
      border: 1px solid rgba(240, 192, 64, 0.25);
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }

    .download-link:hover {
      background: var(--accent-glow);
      border-color: rgba(240, 192, 64, 0.5);
    }

    /* File action pills (download + play) */
    .file-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }

    .file-actions .download-link { margin-top: 0; }

    .play-btn {
      /* override the global button rule */
      width: auto;
      background: none;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: normal;
      animation: none;
      /* pill appearance matching .download-link */
      display: none;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.65rem;
      border: 1px solid rgba(240, 192, 64, 0.25);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      background: var(--accent-glow);
      border-color: rgba(240, 192, 64, 0.5);
    }

    /* Video modal */
    .video-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(11, 12, 16, 0.88);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, visibility 0s 0.25s;
    }

    .video-modal-overlay.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.25s ease, visibility 0s 0s;
    }

    .video-modal-panel {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1rem;
      width: 92vw;
      max-width: 860px;
      box-shadow:
        0 8px 40px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(240, 192, 64, 0.06);
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .video-modal-overlay.is-open .video-modal-panel {
      transform: scale(1);
    }

    .video-modal-close {
      position: absolute;
      top: 0.6rem;
      right: 0.75rem;
      width: auto;
      background: none;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 400;
      line-height: 1;
      padding: 0.25rem 0.4rem;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      animation: none;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .video-modal-close:hover {
      color: var(--text-primary);
      background: var(--border-subtle);
      transform: none;
      box-shadow: none;
    }

    .video-modal-video {
      display: block;
      width: 100%;
      max-height: 70vh;
      border-radius: var(--radius-sm);
      background: #000;
      margin-top: 2rem;
    }

    .derivatives-section {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-subtle);
    }

    .derivatives-label {
      font-size: 0.65rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }

    .derivative-step {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      margin-bottom: 0.3rem;
    }

    .derivative-step .step-icon {
      width: 16px;
      text-align: center;
      font-size: 0.8rem;
      display: inline-block;
    }

    .derivative-step.done .step-icon { color: var(--success); }
    .derivative-step.done .step-label { color: var(--text-secondary); }

    .derivative-step.in-progress .step-icon { color: var(--accent); animation: deriv-spin 1s linear infinite; }
    .derivative-step.in-progress .step-label { color: var(--text-primary); }

    .derivative-step.pending .step-icon { color: var(--text-dim); }
    .derivative-step.pending .step-label { color: var(--text-dim); }

    .derivative-step.failed .step-icon { color: var(--error); }
    .derivative-step.failed .step-label { color: var(--error); }

    .derivatives-time {
      margin-left: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    @keyframes deriv-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Divider line */
    .divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 1.5rem 0;
      display: none;
    }
  </style>
</head>

<body>
  <main>
    <div class="header">
      <h1>Rapid</h1>
      <span class="badge">upload</span>
      <a href="/files.html" style="margin-left:auto;font-family:var(--font-mono);font-size:0.72rem;color:var(--accent);text-decoration:none;padding:0.3rem 0.65rem;border:1px solid rgba(240,192,64,0.25);border-radius:var(--radius-sm);transition:all 0.2s ease;">Files</a>
    </div>
    <div class="drop-zone" id="drop-zone">
      <span class="drop-zone-icon">&#8593;</span>
      <div class="drop-zone-text">
        Drop files here or <strong>browse</strong>
      </div>
      <div class="file-count" id="file-count"></div>
    </div>
    <input type="file" id="file-input" multiple>
    <button id="upload-btn" disabled>Upload</button>
    <div class="divider" id="divider"></div>
    <div id="uploads"></div>
  </main>

  <div class="video-modal-overlay" id="video-modal"
       role="dialog" aria-modal="true" aria-label="Video player">
    <div class="video-modal-panel">
      <button class="video-modal-close" id="video-modal-close"
              aria-label="Close video player">&times;</button>
      <video class="video-modal-video" id="video-modal-video"
             controls playsinline></video>
    </div>
  </div>

  <script>
    const DERIVATIVE_LABELS = [
      { size: "32x32", name: "table thumb" },
      { size: "80x80", name: "thumbnail" },
      { size: "250x250", name: "small preview" },
      { size: "800x600", name: "large preview" },
      { size: "6000x6000", name: "high-res" },
    ];

    const fileInput = document.getElementById("file-input");
    const uploadBtn = document.getElementById("upload-btn");
    const uploadsDiv = document.getElementById("uploads");
    const dropZone = document.getElementById("drop-zone");
    const fileCountEl = document.getElementById("file-count");
    const divider = document.getElementById("divider");
    const videoModal = document.getElementById("video-modal");
    const videoEl = document.getElementById("video-modal-video");
    const videoCloseBtn = document.getElementById("video-modal-close");
    let videoReturnFocus = null;

    // Drop zone interactions
    dropZone.addEventListener("click", () => fileInput.click());

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("drag-over");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("drag-over");
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("drag-over");
      fileInput.files = e.dataTransfer.files;
      fileInput.dispatchEvent(new Event("change"));
    });

    // WebSocket connection for upload progress
    let ws = null;
    const uploadHandlers = new Map();

    function connectWs() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}/ws/upload-progress`);
      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        const handler = uploadHandlers.get(data.upload_id);
        if (handler) handler(data);
      };
      ws.onclose = () => {
        setTimeout(connectWs, 2000);
      };
    }

    connectWs();

    fileInput.addEventListener("change", () => {
      const count = fileInput.files.length;
      uploadBtn.disabled = !count;
      uploadsDiv.innerHTML = "";
      divider.style.display = "none";
      if (count) {
        fileCountEl.style.display = "block";
        fileCountEl.textContent = `${count} file${count > 1 ? "s" : ""} selected`;
      } else {
        fileCountEl.style.display = "none";
      }
    });

    let rowIndex = 0;

    function openModal(fileId) {
      videoReturnFocus = document.activeElement;
      videoEl.src = "/files/" + fileId;
      videoModal.classList.add("is-open");
      videoCloseBtn.focus();
    }

    function closeModal() {
      videoEl.pause();
      videoEl.removeAttribute("src");
      videoEl.load(); // abort buffering / in-flight range requests
      videoModal.classList.remove("is-open");
      if (videoReturnFocus) { videoReturnFocus.focus(); videoReturnFocus = null; }
    }

    videoCloseBtn.addEventListener("click", closeModal);
    videoModal.addEventListener("click", (e) => { if (e.target === videoModal) closeModal(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && videoModal.classList.contains("is-open")) closeModal();
    });

    function uploadFile(file) {
      const delay = rowIndex * 80;
      rowIndex++;

      const row = document.createElement("div");
      row.className = "file-row";
      row.style.animationDelay = delay + "ms";

      const name = document.createElement("div");
      name.className = "file-name";
      name.textContent = file.name;

      // Phase 1: browser -> server
      const label1 = document.createElement("div");
      label1.className = "progress-label";
      label1.textContent = "Sending to server";

      const progressWrap1 = document.createElement("div");
      progressWrap1.className = "progress-wrap";

      const bar1 = document.createElement("progress");
      bar1.max = 100;
      bar1.value = 0;

      const pct1 = document.createElement("span");
      pct1.textContent = "0%";

      progressWrap1.appendChild(bar1);
      progressWrap1.appendChild(pct1);

      // Phase 2: server -> S3 (hidden until S3 upload starts)
      const label2 = document.createElement("div");
      label2.className = "progress-label";
      label2.textContent = "Uploading to storage";
      label2.style.display = "none";

      const progressWrap2 = document.createElement("div");
      progressWrap2.className = "progress-wrap";
      progressWrap2.style.display = "none";

      const bar2 = document.createElement("progress");
      bar2.max = 100;
      bar2.value = 0;

      const pct2 = document.createElement("span");
      pct2.textContent = "";

      progressWrap2.appendChild(bar2);
      progressWrap2.appendChild(pct2);

      const statusDiv = document.createElement("div");
      statusDiv.className = "file-status";

      const downloadLink = document.createElement("a");
      downloadLink.className = "download-link";

      const fileActions = document.createElement("div");
      fileActions.className = "file-actions";
      fileActions.appendChild(downloadLink);

      const playBtn = document.createElement("button");
      playBtn.className = "play-btn";
      playBtn.type = "button";
      playBtn.textContent = "Play";
      fileActions.appendChild(playBtn);

      row.appendChild(name);
      row.appendChild(label1);
      row.appendChild(progressWrap1);
      row.appendChild(label2);
      row.appendChild(progressWrap2);
      row.appendChild(statusDiv);
      row.appendChild(fileActions);
      uploadsDiv.appendChild(row);

      const uploadId = crypto.randomUUID();
      row.dataset.uploadId = uploadId;
      let partsCompleted = 0;
      const t0 = performance.now(); // start of temp file phase
      let tS3Start = null;
      let timerInterval = null;

      // Live elapsed timer for phase 1
      timerInterval = setInterval(() => {
        const elapsed = ((performance.now() - t0) / 1000).toFixed(3);
        label1.textContent = `Sending to server \u2014 ${elapsed}s`;
      }, 100);

      // Register WS event handler for this upload
      uploadHandlers.set(uploadId, (data) => {
        switch (data.type) {
          case "upload_started": {
            // Phase 1 done
            clearInterval(timerInterval);
            const tempDuration = ((performance.now() - t0) / 1000).toFixed(3);
            label1.textContent = `Sending to server \u2014 ${tempDuration}s`;

            // Phase 2 begins
            tS3Start = performance.now();
            label2.style.display = "block";
            progressWrap2.style.display = "flex";
            bar2.value = 0;
            pct2.textContent = `0/${data.total_parts} parts`;

            timerInterval = setInterval(() => {
              const elapsed = ((performance.now() - tS3Start) / 1000).toFixed(3);
              label2.textContent = `Uploading to storage \u2014 ${elapsed}s`;
            }, 100);
            break;
          }
          case "part_completed": {
            partsCompleted++;
            const pctVal = Math.round((partsCompleted / data.total_parts) * 100);
            bar2.value = pctVal;
            pct2.textContent = `${partsCompleted}/${data.total_parts} parts`;
            break;
          }
          case "upload_completed": {
            clearInterval(timerInterval);
            const s3Duration = tS3Start ? ((performance.now() - tS3Start) / 1000).toFixed(3) : "?";
            label2.textContent = `Uploading to storage \u2014 ${s3Duration}s`;
            bar2.value = 100;
            pct2.textContent = `done (${partsCompleted} parts)`;
            break;
          }
          case "upload_failed":
            clearInterval(timerInterval);
            pct2.textContent = "failed";
            break;
          case "processing_started": {
            const labels = DERIVATIVE_LABELS.slice(0, data.total_derivatives);
            const section = document.createElement('div');
            section.className = 'derivatives-section';
            section.innerHTML = '<div class="derivatives-label">Derivatives</div>';
            // Decode step (shown first, before derivative sizes)
            const decodeStep = document.createElement('div');
            decodeStep.className = 'derivative-step in-progress';
            decodeStep.dataset.role = 'decode';
            decodeStep.innerHTML = '<span class="step-icon">\u27f3</span><span class="step-label">decoding image\u2026</span>';
            section.appendChild(decodeStep);
            labels.forEach((item, i) => {
              const step = document.createElement('div');
              step.className = 'derivative-step pending';
              step.dataset.index = i;
              step.innerHTML = `<span class="step-icon">\u25cb</span><span class="step-label">${item.name}${item.size !== "6000x6000" ? ' ' + item.size : ''}</span>`;
              section.appendChild(step);
            });
            row.appendChild(section);
            break;
          }
          case "decoding_completed": {
            const section = row.querySelector('.derivatives-section');
            if (section) {
              const decodeStep = section.querySelector('[data-role="decode"]');
              if (decodeStep) {
                decodeStep.className = 'derivative-step done';
                const elapsed = data.elapsed_ms;
                const timeStr = elapsed < 1000 ? `${elapsed}ms` : `${(elapsed / 1000).toFixed(1)}s`;
                decodeStep.querySelector('.step-icon').textContent = '\u2713';
                decodeStep.querySelector('.step-label').textContent = `decoded ${timeStr}`;
              }
              // Start first derivative step
              const first = section.querySelector('[data-index="0"]');
              if (first && first.classList.contains('pending')) {
                first.className = 'derivative-step in-progress';
                first.querySelector('.step-icon').textContent = '\u27f3';
              }
            }
            break;
          }
          case "derivative_completed": {
            const section = row.querySelector('.derivatives-section');
            if (section) {
              const step = section.querySelector(`[data-index="${data.derivative_number - 1}"]`);
              if (step) {
                step.className = 'derivative-step done';
                step.querySelector('.step-icon').textContent = '✓';
                const elapsed = data.elapsed_ms;
                const timeStr = elapsed < 1000 ? `${elapsed}ms` : `${(elapsed / 1000).toFixed(1)}s`;
                const label = step.querySelector('.step-label');
                label.textContent = label.textContent.replace(/\u2026$/, '') + ` ${timeStr}`;
              }
              const next = section.querySelector(`[data-index="${data.derivative_number}"]`);
              if (next && next.classList.contains('pending')) {
                next.className = 'derivative-step in-progress';
                next.querySelector('.step-icon').textContent = '⟳';
              }
            }
            break;
          }
          case "processing_completed": {
            const section = row.querySelector('.derivatives-section');
            if (section) {
              section.querySelectorAll('.derivative-step').forEach(s => {
                if (!s.classList.contains('done')) {
                  s.className = 'derivative-step done';
                  s.querySelector('.step-icon').textContent = '✓';
                }
              });
              const elapsed = data.elapsed_ms;
              const timeNote = document.createElement('span');
              timeNote.className = 'derivatives-time';
              timeNote.textContent = elapsed < 1000
                ? `${elapsed}ms`
                : `${(elapsed / 1000).toFixed(1)}s`;
              section.appendChild(timeNote);
            }
            uploadHandlers.delete(data.upload_id);
            break;
          }
          case "processing_failed": {
            const section = row.querySelector('.derivatives-section');
            if (section) {
              section.querySelectorAll('.derivative-step.in-progress').forEach(s => {
                s.className = 'derivative-step failed';
                s.querySelector('.step-icon').textContent = '×';
              });
            }
            uploadHandlers.delete(data.upload_id);
            break;
          }
        }
      });

      // Subscribe on WS before starting POST
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "subscribe", upload_id: uploadId }));
      }

      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/upload");
        xhr.setRequestHeader("X-Upload-Id", uploadId);
        xhr.setRequestHeader("X-File-Name", file.name);

        xhr.upload.addEventListener("progress", (e) => {
          if (e.lengthComputable) {
            const pct = Math.round((e.loaded / e.total) * 100);
            bar1.value = pct;
            pct1.textContent = pct + "%";
          }
        });

        xhr.addEventListener("load", () => {
          clearInterval(timerInterval);
          if (xhr.status === 201) {
            // If no WS events arrived (small file / single PUT), finalize phase 1 timing
            if (!tS3Start) {
              const totalDuration = ((performance.now() - t0) / 1000).toFixed(3);
              label1.textContent = `Sending to server \u2014 ${totalDuration}s`;
            }
            const data = JSON.parse(xhr.responseText);
            statusDiv.className = "file-status success";
            const sizeMB = (data.size_bytes / (1024 * 1024)).toFixed(2);
            statusDiv.textContent = `Done — ${sizeMB} MB, ${data.mime_type}`;
            downloadLink.href = `/files/${data.id}`;
            downloadLink.download = file.name;
            downloadLink.textContent = "Download";
            downloadLink.style.display = "inline-flex";
            if (data.mime_type && data.mime_type.startsWith("video/")) {
              playBtn.style.display = "inline-flex";
              playBtn.addEventListener("click", () => openModal(data.id));
            }
            // Keep handler alive for image processing events
            if (!data.mime_type || !data.mime_type.startsWith('image/')) {
              uploadHandlers.delete(uploadId);
            }
          } else {
            statusDiv.className = "file-status error";
            let msg = xhr.responseText;
            try { msg = JSON.parse(xhr.responseText).error ?? msg; } catch (_) {}
            statusDiv.textContent = `Error ${xhr.status}: ${msg}`;
            uploadHandlers.delete(uploadId);
          }
          resolve();
        });

        xhr.addEventListener("error", () => {
          clearInterval(timerInterval);
          uploadHandlers.delete(uploadId);
          statusDiv.className = "file-status error";
          statusDiv.textContent = "Network error";
          resolve();
        });

        xhr.send(file);
      });
    }

    uploadBtn.addEventListener("click", async () => {
      const files = Array.from(fileInput.files);
      if (!files.length) return;

      uploadBtn.disabled = true;
      uploadsDiv.innerHTML = "";
      divider.style.display = "block";
      rowIndex = 0;

      const uploads = files.map((file) => uploadFile(file));
      await Promise.all(uploads);

      uploadBtn.disabled = false;
    });
  </script>
</body>

</html>
