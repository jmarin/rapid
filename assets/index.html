<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapid - File Upload</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 4rem 1rem;
    }

    main {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 1rem;
    }

    button {
      background: #333;
      color: #fff;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #uploads {
      margin-top: 1rem;
    }

    .file-row {
      margin-bottom: 0.75rem;
    }

    .file-name {
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .progress-wrap progress {
      flex: 1;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      appearance: none;
    }

    .progress-wrap progress::-webkit-progress-bar {
      background: #eee;
      border-radius: 3px;
    }

    .progress-wrap progress::-webkit-progress-value {
      background: #333;
      border-radius: 3px;
    }

    .progress-wrap span {
      font-size: 0.8rem;
      min-width: 3ch;
      text-align: right;
    }

    .progress-label {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 0.15rem;
    }

    .file-status {
      font-size: 0.8rem;
      margin-top: 0.25rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error {
      color: #c00;
    }

    .success {
      color: #060;
    }
  </style>
</head>

<body>
  <main>
    <h1>Upload Files</h1>
    <label for="file-input">Choose files</label>
    <input type="file" id="file-input" multiple>
    <button id="upload-btn" disabled>Upload</button>
    <div id="uploads"></div>
  </main>
  <script>
    const fileInput = document.getElementById("file-input");
    const uploadBtn = document.getElementById("upload-btn");
    const uploadsDiv = document.getElementById("uploads");

    // WebSocket connection for upload progress
    let ws = null;
    const uploadHandlers = new Map();

    function connectWs() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}/ws/upload-progress`);
      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        const handler = uploadHandlers.get(data.upload_id);
        if (handler) handler(data);
      };
      ws.onclose = () => {
        setTimeout(connectWs, 2000);
      };
    }

    connectWs();

    fileInput.addEventListener("change", () => {
      uploadBtn.disabled = !fileInput.files.length;
      uploadsDiv.innerHTML = "";
    });

    function uploadFile(file) {
      const row = document.createElement("div");
      row.className = "file-row";

      const name = document.createElement("div");
      name.className = "file-name";
      name.textContent = file.name;

      // Phase 1: browser -> server
      const label1 = document.createElement("div");
      label1.className = "progress-label";
      label1.textContent = "Sending to server";

      const progressWrap1 = document.createElement("div");
      progressWrap1.className = "progress-wrap";

      const bar1 = document.createElement("progress");
      bar1.max = 100;
      bar1.value = 0;

      const pct1 = document.createElement("span");
      pct1.textContent = "0%";

      progressWrap1.appendChild(bar1);
      progressWrap1.appendChild(pct1);

      // Phase 2: server -> S3 (hidden until S3 upload starts)
      const label2 = document.createElement("div");
      label2.className = "progress-label";
      label2.textContent = "Uploading to storage";
      label2.style.display = "none";

      const progressWrap2 = document.createElement("div");
      progressWrap2.className = "progress-wrap";
      progressWrap2.style.display = "none";

      const bar2 = document.createElement("progress");
      bar2.max = 100;
      bar2.value = 0;

      const pct2 = document.createElement("span");
      pct2.textContent = "";

      progressWrap2.appendChild(bar2);
      progressWrap2.appendChild(pct2);

      const statusDiv = document.createElement("div");
      statusDiv.className = "file-status";

      row.appendChild(name);
      row.appendChild(label1);
      row.appendChild(progressWrap1);
      row.appendChild(label2);
      row.appendChild(progressWrap2);
      row.appendChild(statusDiv);
      uploadsDiv.appendChild(row);

      const uploadId = crypto.randomUUID();
      let partsCompleted = 0;

      // Register WS event handler for this upload
      uploadHandlers.set(uploadId, (data) => {
        switch (data.type) {
          case "upload_started":
            label2.style.display = "block";
            progressWrap2.style.display = "flex";
            bar2.value = 0;
            pct2.textContent = `0/${data.total_parts} parts`;
            break;
          case "part_completed":
            partsCompleted++;
            const pct = Math.round((partsCompleted / data.total_parts) * 100);
            bar2.value = pct;
            pct2.textContent = `${partsCompleted}/${data.total_parts} parts`;
            break;
          case "upload_completed":
            bar2.value = 100;
            pct2.textContent = "done";
            break;
          case "upload_failed":
            pct2.textContent = "failed";
            break;
        }
      });

      // Subscribe on WS before starting POST
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "subscribe", upload_id: uploadId }));
      }

      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/upload");
        xhr.setRequestHeader("X-Upload-Id", uploadId);

        xhr.upload.addEventListener("progress", (e) => {
          if (e.lengthComputable) {
            const pct = Math.round((e.loaded / e.total) * 100);
            bar1.value = pct;
            pct1.textContent = pct + "%";
          }
        });

        xhr.addEventListener("load", () => {
          uploadHandlers.delete(uploadId);
          if (xhr.status === 201) {
            const data = JSON.parse(xhr.responseText);
            statusDiv.className = "file-status success";
            const sizeMB = (data.size_bytes / (1024 * 1024)).toFixed(2);
            statusDiv.textContent = `Done — ${sizeMB} MB, ${data.mime_type}`;
          } else {
            statusDiv.className = "file-status error";
            statusDiv.textContent = `Error ${xhr.status}: ${xhr.responseText}`;
          }
          resolve();
        });

        xhr.addEventListener("error", () => {
          uploadHandlers.delete(uploadId);
          statusDiv.className = "file-status error";
          statusDiv.textContent = "Network error";
          resolve();
        });

        xhr.send(file);
      });
    }

    uploadBtn.addEventListener("click", async () => {
      const files = Array.from(fileInput.files);
      if (!files.length) return;

      uploadBtn.disabled = true;
      uploadsDiv.innerHTML = "";

      const uploads = files.map((file) => uploadFile(file));
      await Promise.all(uploads);

      uploadBtn.disabled = false;
    });
  </script>
</body>

</html>
