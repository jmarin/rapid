[package]
name = "rapid"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rapid-svc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
dotenvy = "0.15.7"
futures-util = "0.3"
magic = "0.16.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tower-http = { version = "0.6.10", features = ["cors", "fs", "trace", "limit"] }
uuid = { version = "1", features = ["v4"] }
aws-sdk-s3 = "1.132.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
dashmap = "6"
tower = { version = "0.5", features = ["timeout"] }
libvips = "1.7"

[dev-dependencies]
image = "0.25"
